# Market situations by category
# "scene" = market setup, "mood" = market condition, "player_action" = the question/prompt

scenes:
  earnings_analysis:
    - scene: "Stock just reported Q4 earnings after the bell."
      mood: "Beat on EPS, miss on revenue"
      player_action: "Analyze the earnings result and what it means for the stock near-term."
    - scene: "Company reported earnings with strong guidance raise."
      mood: "Beat and raise"
      player_action: "How does the guidance raise change the thesis?"
    - scene: "Stock gapped down 10% on earnings despite an EPS beat."
      mood: "Sell the news"
      player_action: "Why is the stock selling off on a beat and what does it signal?"
    - scene: "Margins compressed significantly despite revenue growth."
      mood: "Top-line growth, margin pressure"
      player_action: "Is the margin compression a structural problem or temporary?"
    - scene: "Company missed estimates but reiterated full-year guidance."
      mood: "Miss with guidance hold"
      player_action: "How should investors interpret the guidance hold after a miss?"
    - scene: "Management lowered guidance on the earnings call."
      mood: "Guidance cut"
      player_action: "What are the implications of the guidance cut for the stock?"

  technical_pattern:
    - scene: "Stock has been consolidating in a tight range for 6 weeks."
      mood: "Low volatility consolidation"
      player_action: "What does the consolidation pattern suggest and what would confirm a breakout?"
    - scene: "Stock broke out of a multi-month base on heavy volume."
      mood: "Breakout"
      player_action: "Analyze the breakout — is it actionable and where is the target?"
    - scene: "50-day moving average crossing below the 200-day moving average."
      mood: "Death cross forming"
      player_action: "What does the death cross signal and how reliable is it here?"
    - scene: "RSI hit 78 on the daily after a 35% run in 3 weeks."
      mood: "Overbought momentum"
      player_action: "How overbought is the setup and what are the risk/reward implications?"
    - scene: "Stock testing major support at the 200-day MA on above-average volume."
      mood: "Support test"
      player_action: "Is this a buying opportunity at support or a breakdown warning?"
    - scene: "Classic cup-and-handle pattern forming on the weekly chart."
      mood: "Basing pattern"
      player_action: "Walk through the cup-and-handle setup and the ideal entry trigger."

  news_sentiment:
    - scene: "Company announced a major acquisition at a 30% premium."
      mood: "M&A announcement"
      player_action: "Analyze the deal — is it value-accretive or a value-destruction risk?"
    - scene: "Fed Chair made hawkish comments about keeping rates higher for longer."
      mood: "Hawkish Fed surprise"
      player_action: "Which sectors are most exposed to this macro shift and how should positioning change?"
    - scene: "Company announced a $10B share buyback program."
      mood: "Capital return announcement"
      player_action: "How significant is this buyback relative to the market cap and what does it signal?"
    - scene: "A major competitor announced a product that directly challenges this stock's core business."
      mood: "Competitive threat"
      player_action: "How serious is the competitive threat and how should it reprice the stock?"
    - scene: "Inflation data came in hotter than expected."
      mood: "Inflation surprise"
      player_action: "Which stocks and sectors benefit or get hurt most from this inflation data?"
    - scene: "Company is under DOJ antitrust investigation."
      mood: "Regulatory risk"
      player_action: "How should investors think about the regulatory overhang on valuation?"

  trade_signal:
    - scene: "All indicators aligning — earnings catalyst in 2 weeks, strong technicals, sector tailwind."
      mood: "High conviction setup"
      player_action: "Build the trade thesis: entry, target, stop loss, and position size rationale."
    - scene: "Stock pulling back 8% on no company-specific news in a strong market."
      mood: "Sympathy pullback"
      player_action: "Is this a buyable dip or a warning sign? Build the case."
    - scene: "Options market showing unusual call buying activity ahead of earnings."
      mood: "Options flow signal"
      player_action: "What does the unusual options activity suggest and how would you trade around it?"
    - scene: "Stock at 52-week high with strong relative strength vs the S&P 500."
      mood: "Momentum at highs"
      player_action: "Is chasing the breakout at highs justified here? Make the case for or against."
    - scene: "Short interest at 25% of float with a potential catalyst in 3 weeks."
      mood: "Short squeeze setup"
      player_action: "Analyze the short squeeze potential and the risk/reward of the trade."

  risk_assessment:
    - scene: "Position is up 40% and approaching the original price target."
      mood: "Near target, deciding to hold or sell"
      player_action: "How should you think about trimming, holding, or raising the target?"
    - scene: "Stock has a 3x leverage ETF with significant decay."
      mood: "Leveraged product risk"
      player_action: "Explain the decay risk in leveraged ETFs and when they are/aren't appropriate."
    - scene: "Concentrated 20% portfolio position in a single stock ahead of earnings."
      mood: "Concentration risk"
      player_action: "How should position sizing change given the concentration and upcoming catalyst?"
    - scene: "High-conviction trade going against you — stock down 15% from entry."
      mood: "Drawdown management"
      player_action: "At what point do you cut the loss vs. average down, and what factors matter?"
    - scene: "Macro environment shifting — yields rising, dollar strengthening."
      mood: "Macro headwind emerging"
      player_action: "Which positions in the portfolio are most vulnerable to this macro shift?"
