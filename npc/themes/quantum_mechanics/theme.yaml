# Quantum Mechanics Tutor Theme
# Used by: pipeline/generate.py, pipeline/validate.py, pipeline/dataset.py

name: quantum_mechanics
description: "Quantum mechanics Q&A — expert tutor explaining concepts at varying depth levels"

# ---------------------------------------------------------------------------
# Generation models
# ---------------------------------------------------------------------------
generators:
  writer:
    role: primary
    prompt_file: prompts/generator_writer.txt
    temperature: 0.7          # lower than roleplay — accuracy matters more
    max_tokens: 500

  opus:
    role: secondary
    prompt_file: prompts/generator_opus.txt
    temperature: 0.65
    max_tokens: 1000          # longer for detailed derivations
    no_think: true

# ---------------------------------------------------------------------------
# Reviewers
# ---------------------------------------------------------------------------
reviewers:
  writer:
    prompt_file: prompts/reviewer_writer.txt
    pass_field: score
    pass_threshold: null

  qwen:
    prompt_file: prompts/reviewer_qwen.txt
    pass_field: score
    pass_threshold: null

# ---------------------------------------------------------------------------
# Categories
# ---------------------------------------------------------------------------
categories:
  - name: conceptual
    description: "Conceptual question about a quantum mechanics principle (e.g. superposition, entanglement)"
    weight: 0.35

  - name: mathematical
    description: "Step-by-step derivation or worked problem (Schrödinger equation, operators, eigenvalues)"
    weight: 0.30

  - name: intuition_building
    description: "Analogy or thought experiment to build physical intuition"
    weight: 0.20

  - name: common_misconceptions
    description: "Correcting a common student misconception about QM"
    weight: 0.15

# ---------------------------------------------------------------------------
# Lore / context sources
# ---------------------------------------------------------------------------
lore:
  kiwix:
    enabled: true
    topics:
      - "Quantum mechanics"
      - "Wave function"
      - "Schrödinger equation"
      - "Heisenberg uncertainty principle"
      - "Quantum entanglement"
      - "Superposition principle"
      - "Quantum tunneling"
      - "Dirac notation"
      - "Hilbert space"
      - "Pauli exclusion principle"
      - "Spin (physics)"
      - "Double-slit experiment"
      - "Copenhagen interpretation"
      - "Many-worlds interpretation"
      - "Planck constant"
    max_chars: 1200           # more context for technical accuracy

# ---------------------------------------------------------------------------
# HuggingFace dataset mixing  (placeholder repos — swap for real ones)
# ---------------------------------------------------------------------------
hf_datasets:
  - repo: "camel-ai/physics"
    split: "train"
    local_file: null
    max_samples: 1000
    weight: 0.4
    format: alpaca
    column_map:
      human: instruction
      assistant: response
    filter:
      min_turns: 1
      require_system: false

  - repo: "Open-Orca/OpenOrca"
    split: "train"
    local_file: null
    max_samples: 600
    weight: 0.35
    format: alpaca
    column_map:
      human: question
      assistant: response
    filter:
      min_turns: 1
      require_system: false

  - repo: "Maxx0/quantum-mechanics-QA"
    split: "train"
    local_file: null
    max_samples: 400
    weight: 0.25
    format: sharegpt
    column_map:
      conversations: conversations
    filter:
      min_turns: 2
      require_system: false

# ---------------------------------------------------------------------------
# Dataset builder config
# ---------------------------------------------------------------------------
dataset:
  system_prompt: prompts/system_prompt.txt
  human_turn: prompts/human_turn.txt
  response_field: response
  generator_keys: [writer, opus]

# ---------------------------------------------------------------------------
# Fast filter config
# ---------------------------------------------------------------------------
fast_filter:
  system_prompt: fast_filter_system
  prompt_template: fast_filter_prompt
  score_field: score
  max_tokens: 10
  rate_limit_sleep: 0.2

# ---------------------------------------------------------------------------
# Cross-review config
# ---------------------------------------------------------------------------
cross_review:
  prompt_template: cross_review_prompt
  max_tokens: 100             # slightly more — technical correctness needs nuance
  rate_limit_sleep: 0.3

# ---------------------------------------------------------------------------
# Output validation — what a valid generated sample looks like
# ---------------------------------------------------------------------------
validation:
  min_length: 80              # QM answers should have substance
  max_lines: 20               # derivations can run longer than roleplay
  # no must_match patterns — QM responses don't need italic/quotes

# ---------------------------------------------------------------------------
# Output format
# ---------------------------------------------------------------------------
output:
  format: sharegpt
  chat_template: chatml
  system_role: system
  user_role: human
  assistant_role: gpt
