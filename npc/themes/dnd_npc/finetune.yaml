# Fine-tune config for D&D NPC theme
# Used by: pipeline/train.py

base_model: /home/kmbandy/models/SmolLM3-3B-Base
output_dir: /home/kmbandy/mad-lab-dnd/training/output/smollm3-npc

# Data (defaults to run config output_dir/train.jsonl if not set)
# train_data: /home/kmbandy/mad-lab-dnd/training/data/train.jsonl
# eval_data:  /home/kmbandy/mad-lab-dnd/training/data/eval.jsonl

# Training
num_epochs: 3
micro_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2e-4
warmup_steps: 20
sequence_len: 2048

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# Optional overrides (defaults shown):
# weight_decay: 0.01
# max_grad_norm: 1.0
# gradient_checkpointing: false
# packing: false
# lr_scheduler_type: cosine    # cosine | linear | constant
# logging_steps: 10
# eval_steps: 100
# save_steps: 100
# save_total_limit: 2
# seed: 42
# lora_target_modules: all-linear
# report_to: none              # none | wandb | tensorboard
# wandb_project: my-project    # only used if report_to: wandb
