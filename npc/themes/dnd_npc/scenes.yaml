# Scene pools by category — (scene_description, mood, player_action)
# Each category maps to a list of scene entries.
# The pipeline picks randomly, weighted by category weights in theme.yaml.

scenes:
  npc_dialogue:
    - scene: "The Red Lantern Tavern, evening. Crowded but not rowdy."
      mood: "Neutral"
      player_action: "The player sits down across from the NPC and asks about recent events in town."
    - scene: "A back-alley meeting, night. Rain pattering on cobblestones."
      mood: "Cautious"
      player_action: "The player slides a coin purse across the table without a word."
    - scene: "Guild hall antechamber. Formal and uncomfortable."
      mood: "Guarded"
      player_action: "The player presents a letter of introduction from a mutual contact."
    - scene: "Marketplace stall, midday. Busy and loud."
      mood: "Distracted"
      player_action: "The player asks about a specific item they need urgently."
    - scene: "Temple entrance, dawn. Quiet and reverent."
      mood: "Composed"
      player_action: "The player asks for information about a missing person."
    - scene: "A private study, firelight flickering."
      mood: "Thoughtful"
      player_action: "The player asks the NPC for their opinion on a difficult decision."
    - scene: "A ship's cabin, mid-voyage. The sea is rough."
      mood: "Tense"
      player_action: "The player asks the NPC why they really took this job."
    - scene: "Underground fighting pit, between bouts."
      mood: "Wired"
      player_action: "The player approaches the NPC with a proposition."
    - scene: "A moonlit garden. The party is audible inside."
      mood: "Conspiratorial"
      player_action: "The player pulls the NPC aside away from the crowd."
    - scene: "Roadside camp at dusk. Shared fire, strangers."
      mood: "Wary"
      player_action: "The player offers the NPC food and asks where they're headed."
    - scene: "A wizard's tower, waiting room. Strange sounds above."
      mood: "Anxious"
      player_action: "The player strikes up conversation while they both wait."
    - scene: "Prison visiting room. Guards nearby."
      mood: "Controlled"
      player_action: "The player has come to deliver a message — and possibly an offer."

  npc_confrontation:
    - scene: "Dungeon corridor. Torchlight flickers. No escape route visible."
      mood: "Hostile"
      player_action: "The player has been caught somewhere they shouldn't be."
    - scene: "Nobleman's study. Guards outside the door."
      mood: "Cold fury"
      player_action: "The player has just accused the NPC of betrayal to their face."
    - scene: "City gate checkpoint. Soldiers present."
      mood: "Suspicious"
      player_action: "The player's papers don't quite add up and the NPC has noticed."
    - scene: "Ruined tower, exposed to the elements."
      mood: "Desperate"
      player_action: "The player holds something the NPC desperately needs."
    - scene: "Banquet hall. Other guests are watching."
      mood: "Controlled rage"
      player_action: "The player has just publicly contradicted the NPC's version of events."
    - scene: "A dark forest road, torches extinguished."
      mood: "Predatory"
      player_action: "The NPC has been waiting for the player. This was not a coincidence."
    - scene: "Throne room. The court watches in silence."
      mood: "Imperial"
      player_action: "The player has spoken out of turn and the NPC will not let it pass."
    - scene: "Burning building. Both are trapped."
      mood: "Frantic"
      player_action: "The player demands answers the NPC doesn't want to give."
    - scene: "Arena stands. The crowd is restless."
      mood: "Contemptuous"
      player_action: "The player has challenged the NPC's authority publicly."
    - scene: "Narrow bridge over a chasm. No room to pass."
      mood: "Calculating"
      player_action: "The NPC blocks the way and names their price."

  npc_revelation:
    - scene: "Private room at an inn. Candles burning low."
      mood: "Reluctant"
      player_action: "The player has finally earned enough trust. The NPC decides to tell the truth."
    - scene: "Abandoned safehouse. Dust on everything."
      mood: "Haunted"
      player_action: "The player asks about the NPC's past — the question they've been avoiding."
    - scene: "Rooftop overlooking the city, late at night."
      mood: "Resigned"
      player_action: "The player has pieced it together and confronts the NPC gently."
    - scene: "Dying campfire. Everyone else is asleep."
      mood: "Vulnerable"
      player_action: "The player sits in silence and waits. The NPC finally speaks."
    - scene: "Church confessional. Anonymity implied."
      mood: "Ashamed"
      player_action: "The player asks what the NPC has done that they regret most."
    - scene: "Graveyard at dusk. Fresh flowers on a headstone."
      mood: "Grief-stricken"
      player_action: "The player follows the NPC here and waits to be acknowledged."
    - scene: "A locked vault. The NPC holds the only key."
      mood: "Conflicted"
      player_action: "The player has figured out what's inside and asks why it's hidden."
    - scene: "Rain-soaked battlements. The city below is quiet."
      mood: "Exhausted"
      player_action: "The player asks the NPC if they ever regret the choices that led here."

  npc_ambient:
    - scene: "Busy market street. The NPC is working."
      mood: "Busy"
      player_action: "The player asks for simple directions."
    - scene: "Inn common room. The NPC is eating alone."
      mood: "Tired"
      player_action: "The player sits nearby and makes small talk."
    - scene: "Stable yard, morning. Horses being readied."
      mood: "Content"
      player_action: "The player asks if the NPC has heard anything interesting lately."
    - scene: "Library. The NPC is reading."
      mood: "Absorbed"
      player_action: "The player interrupts to ask a simple question."
    - scene: "Temple courtyard. The NPC is tending the garden."
      mood: "Peaceful"
      player_action: "The player asks about the local history of the area."
    - scene: "Dockside, early morning. Gulls overhead."
      mood: "Indifferent"
      player_action: "The player tries to make conversation with a stranger."
    - scene: "Smithy, mid-afternoon. The forge is hot."
      mood: "Focused"
      player_action: "The player watches the NPC work and asks about the craft."
    - scene: "Herbalist's shop. Bundles of dried plants everywhere."
      mood: "Methodical"
      player_action: "The player asks if the NPC has anything for a specific ailment."
    - scene: "Festival crowd, midday. Music and laughter nearby."
      mood: "Festive"
      player_action: "The player spots the NPC and waves them over."
    - scene: "Gatehouse, night watch. Stars visible above."
      mood: "Contemplative"
      player_action: "The player relieves the NPC's boredom with a question about the stars."
    - scene: "Apothecary back room. Shelves of unlabeled vials."
      mood: "Secretive"
      player_action: "The player asks about something that isn't on the public shelves."
