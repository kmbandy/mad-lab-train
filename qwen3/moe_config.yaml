# mergekit MOEification config — Qwen3-1.7B dual expert
#
# Usage (after both fine-tunes complete):
#   pip install mergekit
#   mergekit-moe moe_config.yaml --out models/qwen3-1.7b-moe --copy-tokenizer
#
# Then quantize for RX 480 deployment:
#   ~/llama.cpp/build-rocm/bin/llama-quantize \
#     models/qwen3-1.7b-moe/model.safetensors \
#     models/Qwen3-1.7B-MOE-Q8_0.gguf Q8_0
#
# Architecture note:
#   MOEification converts the two fine-tuned FFN layers into a mixture-of-experts
#   block with a learned router. ~A500M parameters active per token on RX 480.
#   Both experts share the same base attention weights; only FFN layers are gated.

base_model: Qwen/Qwen3-1.7B

experts:
  - source_model: /mnt/hdd/models/qwen3-1.7b-technical-merged
    positive_prompts:
      - "RSI"
      - "MACD"
      - "EMA"
      - "price action"
      - "technical signal"
      - "OHLCV"
      - "indicator"
      - "candlestick"
      - "support resistance"

  - source_model: /mnt/hdd/models/qwen3-1.7b-sentiment-merged
    positive_prompts:
      - "earnings"
      - "revenue"
      - "analyst"
      - "upgrade"
      - "downgrade"
      - "news"
      - "filing"
      - "10-K"
      - "sentiment"
      - "headline"
      - "insider"

router_type: softmax    # learned soft router (alternative: top-1 hard)
num_experts_per_tok: 1  # only 1 expert active → keeps VRAM at ~1.7B level
