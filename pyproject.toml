[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mad-lab-train"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psutil>=5.9.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.1.0",
    "datasets>=2.19.0",
    "libzim>=3.4.0",
    "beautifulsoup4>=4.12.0",
    "qdrant-client>=1.9.0",
    "duckdb>=0.10.0",
    # ML training stack — torch must be installed separately (ROCm vs CUDA wheel)
    "transformers>=4.40.0",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
]

[project.scripts]
pipeline-server = "pipeline.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
